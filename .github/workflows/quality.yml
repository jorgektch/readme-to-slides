name: Validate README to Slides

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run JavaScript unit tests
        run: node --test tests/*.test.mjs
      - name: Validate Markdown, config and local assets
        run: python tests/check_deck.py

  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/readme-to-slides-server.log 2>&1 &
          echo $! > /tmp/readme-to-slides-server.pid
      - name: Test actual browser rendering
        run: npm run test:e2e
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
