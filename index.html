<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Presentaciones técnicas desde Markdown por Jorge Jesús Quispe Villaverde.">
  <title>Slides | Jorge Jesús</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section id="markdown-slides" data-markdown="README.md"
             data-separator="^\r?\n---\r?\n$"
             data-separator-vertical="^\r?\n--\r?\n$"
             data-separator-notes="^Note:"></section>
  </div></div>
  <div id="deck-counter" class="deck-counter" aria-label="Número de diapositiva" aria-live="off">1 / 1</div>
  <nav class="deck-navigation" role="toolbar" aria-label="Navegación y enlaces de la presentación">
    <button type="button" id="nav-first" title="Primera diapositiva (Inicio)" aria-label="Ir al inicio">
      <i class="fa-solid fa-backward-step" aria-hidden="true"></i>
    </button>
    <button type="button" id="nav-prev" title="Anterior" aria-label="Diapositiva anterior">
      <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </button>
    <button type="button" id="nav-up" title="Diapositiva vertical anterior (Arriba)" aria-label="Subir en el bloque vertical">
      <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
    </button>
    <button type="button" id="nav-down" title="Diapositiva vertical siguiente (Abajo)" aria-label="Bajar en el bloque vertical">
      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>
    <button type="button" id="nav-next" title="Siguiente" aria-label="Diapositiva siguiente">
      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    </button>
    <button type="button" id="nav-last" title="Última diapositiva (Fin)" aria-label="Ir al final">
      <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
    </button>
    <span class="deck-nav-divider" aria-hidden="true"></span>
    <button type="button" id="nav-overview" title="Mostrar/ocultar vista general (Esc u O)" aria-label="Alternar vista general" aria-pressed="false">
      <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
    </button>
    <a id="nav-repository" class="deck-repo-link" href="https://github.com/jorgektch/test" target="_blank" rel="noopener noreferrer" title="Abrir el repositorio en GitHub" aria-label="Abrir repositorio de GitHub">
      <i class="fa-brands fa-github" aria-hidden="true"></i><span>Repo</span>
    </a>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script type="module">

    const acronyms = new Set(["ia", "mcp", "llm", "rag", "api", "gcp", "sdk", "ai"]);
    const connectors = new Set(["de", "del", "y", "en", "con", "desde", "para", "por", "a"]);
    function titleFromSlug(slug) {
      return slug.split(/[-_]+/).filter(Boolean).map((token, i) => {
        const word = token.toLocaleLowerCase("es");
        if (acronyms.has(word)) return word.toUpperCase();
        if (i > 0 && connectors.has(word)) return word;
        return i === 0 ? word[0].toLocaleUpperCase("es") + word.slice(1) : word;
      }).join(" ");
    }

    const query = new URLSearchParams(location.search);
    const requested = query.get("url");
    const localSlug = location.pathname.split("/").filter(Boolean)[0] || "test";
    let slug = localSlug;
    let markdownUrl = "README.md";
    let repositoryUrl = `https://github.com/jorgektch/${encodeURIComponent(localSlug)}`;
    if (requested) {
      try {
        const url = new URL(requested);
        if (url.protocol !== "https:") throw new Error("Solo se permite HTTPS");
        const parts = url.pathname.split("/").filter(Boolean);
        if (url.hostname === "github.com" && parts[2] === "blob" && parts.length >= 5) {
          slug = parts[1];
          repositoryUrl = `https://github.com/${parts[0]}/${parts[1]}`;
          markdownUrl = `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts.slice(3).join("/")}`;
        } else if (url.hostname === "raw.githubusercontent.com" && parts.length >= 4) {
          slug = parts[1];
          repositoryUrl = `https://github.com/${parts[0]}/${parts[1]}`;
          markdownUrl = url.href;
        } else throw new Error("Usa un README público de GitHub");
        document.getElementById("markdown-slides").setAttribute("data-markdown", markdownUrl);
      } catch (err) { console.warn("Se usará el README local:", err.message); }
    }

    await Reveal.initialize({
      hash: true, slideNumber: false, controls: false,
      controlsLayout: "bottom-right", controlsTutorial: false,
      width: 1280, height: 720, margin: 0.06,
      transition: "fade", center: true, plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
    });

    const title = titleFromSlug(slug);
    document.getElementById("nav-repository").href = repositoryUrl;
    document.title = `${title} · Jorge Jesús`;
    const coverTitle = document.querySelector(".reveal .slides section.cover [data-repo-title]");
    if (coverTitle) coverTitle.textContent = title;

    // Mantener el contador lejos de los controles de Reveal.js.
    const counter = document.getElementById("deck-counter");
    function updateCounter() {
      const slides = Reveal.getSlides();
      const current = Reveal.getCurrentSlide();
      const number = Math.max(1, slides.indexOf(current) + 1);
      counter.textContent = `${number} / ${slides.length}`;
    }
    // Toolbar personalizada. Reveal sigue gestionando las flechas del teclado.
    const firstButton = document.getElementById("nav-first");
    const prevButton = document.getElementById("nav-prev");
    const upButton = document.getElementById("nav-up");
    const downButton = document.getElementById("nav-down");
    const nextButton = document.getElementById("nav-next");
    const lastButton = document.getElementById("nav-last");
    const overviewButton = document.getElementById("nav-overview");

    function goToLastSlide() {
      const slides = Reveal.getSlides();
      const target = slides[slides.length - 1];
      if (!target) return;
      const {h, v} = Reveal.getIndices(target);
      Reveal.slide(h, v);
    }
    firstButton.addEventListener("click", () => Reveal.slide(0, 0));
    prevButton.addEventListener("click", () => Reveal.left());
    upButton.addEventListener("click", () => Reveal.up());
    downButton.addEventListener("click", () => Reveal.down());
    nextButton.addEventListener("click", () => Reveal.right());
    lastButton.addEventListener("click", goToLastSlide);
    overviewButton.addEventListener("click", () => Reveal.toggleOverview());

    function updateNavigation() {
      const slides = Reveal.getSlides();
      const current = Reveal.getCurrentSlide();
      const atFirst = current === slides[0];
      const atLast = current === slides[slides.length - 1];
      const routes = Reveal.availableRoutes();
      const fragments = Reveal.availableFragments();
      firstButton.disabled = atFirst;
      lastButton.disabled = atLast;
      prevButton.disabled = atFirst && !fragments.prev;
      nextButton.disabled = atLast && !fragments.next;
      upButton.disabled = !routes.up;
      downButton.disabled = !routes.down;
      const overviewOpen = Reveal.isOverview();
      overviewButton.setAttribute("aria-pressed", String(overviewOpen));
      overviewButton.classList.toggle("is-active", overviewOpen);
      updateCounter();
    }
    Reveal.on("slidechanged", updateNavigation);
    Reveal.on("fragmentshown", updateNavigation);
    Reveal.on("fragmenthidden", updateNavigation);
    Reveal.on("overviewshown", updateNavigation);
    Reveal.on("overviewhidden", updateNavigation);
    // Atajos adicionales para saltar al inicio o al final.
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey ||
          event.target?.closest?.("input, textarea, select, [contenteditable]")) return;
      if (event.key === "Home") { event.preventDefault(); Reveal.slide(0, 0); }
      if (event.key === "End") { event.preventDefault(); goToLastSlide(); }
    });
    updateNavigation();

    // RevealHighlight puede eliminar/cambiar language-mermaid, de modo que NO
    // dependemos de las clases CSS. Detectamos además la sintaxis Mermaid.
    const syntax = /^(?:flowchart\s|graph\s|sequenceDiagram\b|classDiagram\b|stateDiagram(?:-v2)?\b|erDiagram\b|gantt\b|pie\b|journey\b|mindmap\b|timeline\b|gitGraph\b|quadrantChart\b|xychart-beta\b|block-beta\b|sankey-beta\b|requirementDiagram\b|C4Context\b|C4Container\b|C4Component\b)/i;
    const blocks = [...document.querySelectorAll(".reveal .slides pre")]
      .map(pre => ({pre, code: pre.querySelector("code")}))
      .filter(({code}) => !!code)
      .map(({pre, code}) => {
        const source = code.textContent.replace(/\u00a0/g, " ").replace(/^\uFEFF/, "").trim();
        const names = `${code.className} ${pre.className}`.toLowerCase();
        const isMermaid = /(?:language|lang)[-_]mermaid\b/.test(names) || syntax.test(source);
        return {pre, source, isMermaid};
      })
      .filter(block => block.isMermaid);

    window.slideDiagnostics = {detected: blocks.length, rendered: 0, errors: []};
    const panels = blocks.map(({pre, source}, index) => {
      const panel = document.createElement("div");
      panel.className = "diagram-panel";
      panel.dataset.diagramIndex = String(index + 1);
      panel.setAttribute("role", "img");
      panel.setAttribute("aria-label", `Diagrama Mermaid ${index + 1}`);
      pre.replaceWith(panel);
      return {panel, source, index};
    });

    function showDiagramError(panel, source, index, error) {
      const detail = error?.message || String(error);
      console.error(`Diagrama Mermaid ${index + 1}:`, detail, "\nSOURCE:\n", source);
      window.slideDiagnostics.errors.push({diagram: index + 1, message: detail});
      panel.replaceChildren();
      const card = document.createElement("div");
      card.className = "diagram-error";
      const h = document.createElement("h4");
      h.textContent = `No se pudo renderizar el diagrama ${index + 1}`;
      const p = document.createElement("p");
      p.textContent = detail;
      card.append(h, p);
      panel.append(card);
    }

    if (panels.length > 0) {
      try {
        // Importación diferida: las slides no dependen de que cargue Mermaid.
        const {default: mermaid} = await import(
          "https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs"
        );
        mermaid.initialize({
          startOnLoad: false, securityLevel: "strict", theme: "base",
          themeVariables: {
            background: "#0B1020", primaryColor: "#15243A", primaryTextColor: "#F5F7FF",
            primaryBorderColor: "#36E0C4", secondaryColor: "#1D2A40",
            secondaryTextColor: "#F5F7FF", secondaryBorderColor: "#8299B3",
            tertiaryColor: "#0E1D32", tertiaryTextColor: "#F5F7FF",
            lineColor: "#AAB9D0", textColor: "#F5F7FF",
            fontFamily: "Lexend, Arial, sans-serif", noteBkgColor: "#162238",
            noteTextColor: "#F5F7FF", pie1: "#36E0C4", pie2: "#8EA5BC", pie3: "#516E87"
          },
          flowchart: {htmlLabels: false, useMaxWidth: true}
        });
        // Procesar cada figura independientemente; no abortar las demás al fallar una.
        for (const {panel, source, index} of panels) {
          try {
            await mermaid.parse(source);
            const {svg, bindFunctions} = await mermaid.render(`workshop-diagram-${index + 1}`, source);
            if (!svg || !svg.includes("<svg")) throw Error("Mermaid no devolvió SVG");
            panel.innerHTML = svg;
            if (bindFunctions) bindFunctions(panel);
            window.slideDiagnostics.rendered++;
          } catch (error) { showDiagramError(panel, source, index, error); }
        }
      } catch (error) {
        panels.forEach(({panel, source, index}) => showDiagramError(
          panel, source, index,
          new Error(`No se pudo cargar Mermaid desde el CDN: ${error?.message || error}`)
        ));
      }
    }
    Reveal.layout();
    window.addEventListener("resize", () => Reveal.layout());
  </script>
</body>
</html>
