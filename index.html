<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Presentaciones técnicas desde Markdown por Jorge Jesús Quispe Villaverde.">
  <title>Slides | Jorge Jesús</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div class="reveal"><div class="slides">
    <section id="markdown-slides" data-markdown="README.md"
             data-separator="^\r?\n---\r?\n$"
             data-separator-vertical="^\r?\n--\r?\n$"
             data-separator-notes="^Note:"></section>
  </div></div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.esm.min.mjs";

    const acronyms = new Set(["ia", "mcp", "llm", "rag", "api", "gcp", "sdk", "ai"]);
    const connectors = new Set(["de", "del", "y", "en", "con", "desde", "para", "por", "a"]);
    function titleFromSlug(slug) {
      return slug.split(/[-_]+/).filter(Boolean).map((token, i) => {
        const word = token.toLocaleLowerCase("es");
        if (acronyms.has(word)) return word.toUpperCase();
        if (i > 0 && connectors.has(word)) return word;
        return i === 0 ? word[0].toLocaleUpperCase("es") + word.slice(1) : word;
      }).join(" ");
    }

    const query = new URLSearchParams(location.search);
    const requested = query.get("url");
    const localSlug = location.pathname.split("/").filter(Boolean)[0] || "test";
    let slug = localSlug;
    let markdownUrl = "README.md";
    if (requested) {
      try {
        const url = new URL(requested);
        if (url.protocol !== "https:") throw new Error("Solo se permite HTTPS");
        const parts = url.pathname.split("/").filter(Boolean);
        if (url.hostname === "github.com" && parts[2] === "blob" && parts.length >= 5) {
          slug = parts[1];
          markdownUrl = `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts.slice(3).join("/")}`;
        } else if (url.hostname === "raw.githubusercontent.com" && parts.length >= 4) {
          slug = parts[1];
          markdownUrl = url.href;
        } else throw new Error("Usa un README público de GitHub");
        document.getElementById("markdown-slides").setAttribute("data-markdown", markdownUrl);
      } catch (err) { console.warn("Se usará el README local:", err.message); }
    }

    await Reveal.initialize({
      hash: true, slideNumber: "c/t", width: 1280, height: 720, margin: 0.06,
      transition: "fade", center: true, plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
    });

    const title = titleFromSlug(slug);
    document.title = `${title} · Jorge Jesús`;
    const coverTitle = document.querySelector(".reveal .slides section.cover [data-repo-title]");
    if (coverTitle) coverTitle.textContent = title;

    // RevealMarkdown convierte los bloques ```mermaid a <pre><code>.
    // El README es la unica fuente; cada diagrama se valida y renderiza individualmente.
    mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base",
      themeVariables: {
        background: "#0B1020", primaryColor: "#15243A", primaryTextColor: "#F5F7FF",
        primaryBorderColor: "#36E0C4", secondaryColor: "#1D2A40",
        secondaryTextColor: "#F5F7FF", secondaryBorderColor: "#8299B3",
        tertiaryColor: "#0E1D32", tertiaryTextColor: "#F5F7FF",
        lineColor: "#AAB9D0", textColor: "#F5F7FF",
        fontFamily: "Lexend, Arial, sans-serif", noteBkgColor: "#162238",
        noteTextColor: "#F5F7FF", pie1: "#36E0C4", pie2: "#8EA5BC", pie3: "#516E87"
      },
      flowchart: { htmlLabels: false, useMaxWidth: true }
    });

    const codeNodes = [...document.querySelectorAll(".reveal .slides pre code")]
      .filter(node => [...node.classList].some(c => c === "language-mermaid" || c === "lang-mermaid"));

    for (const [index, code] of codeNodes.entries()) {
      const source = code.textContent.replace(/\u00a0/g, " ").trim();
      const panel = document.createElement("div");
      panel.className = "diagram-panel";
      code.closest("pre").replaceWith(panel);
      try {
        // Validar antes evita el grafico de error de Mermaid incrustado en la diapositiva.
        await mermaid.parse(source);
        const {svg, bindFunctions} = await mermaid.render(`mcp-diagram-${index}-${Date.now()}`, source);
        panel.innerHTML = svg;
        if (bindFunctions) bindFunctions(panel);
      } catch (error) {
        console.error(`Error Mermaid diagrama ${index + 1}:`, error, "SOURCE:", source);
        panel.innerHTML = "";
        const box = document.createElement("div");
        box.className = "diagram-error";
        const heading = document.createElement("h4");
        heading.textContent = `Diagrama ${index + 1}: revisar sintaxis Mermaid`;
        const detail = document.createElement("p");
        detail.textContent = error?.message || "No se pudo interpretar el diagrama";
        const original = document.createElement("pre");
        original.textContent = source;
        box.append(heading, detail, original);
        panel.append(box);
      }
    }
    Reveal.layout();
    window.addEventListener("resize", () => Reveal.layout());
  </script>
</body>
</html>
